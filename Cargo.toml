[package]
name = "blazonry"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2024"

[workspace]
members = ["ext-api"]

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["tokio"] }
base64 = "0.23.1"
blazonry-ext-api = { path = "ext-api" }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
fontdue = "0.9.5"
futures-util = "0.3"
http-body-util = "0.1.5"
icalendar = { version = "0.17.17", features = ["chrono-tz", "recurrence"] }
image = "0.25.10"
# `rust_crypto` is not a default feature, and with neither it nor `aws_lc_rs`
# enabled jsonwebtoken panics instead of returning an error the first time
# anything verifies a signature. That panic lands in the middle of an OIDC
# sign-in and takes the server down. `rust_crypto` is the pure-Rust provider;
# `aws_lc_rs` would need a C toolchain in the musl cross build.
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
ldap3 = { version = "0.12", default-features = false, features = ["sync"] }
liquid = "0.26.11"
liquid-core = { version = "0.26.11", features = ["derive"] }
liquid-lib = { version = "0.26.11", features = ["stdlib"] }
password-hash = { version = "0.6.1", features = ["rand_core"] }
qrcode = "0.14.1"
regex-lite = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "macros"] }
taffy = "0.15.1"
tiny-skia = "0.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "process", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = []
browser = ["dep:chromiumoxide", "dep:brotli"]

[dependencies.chromiumoxide]
version = "0.9"
default-features = false
features = ["rustls", "zip8"]
optional = true

[dependencies.brotli]
version = "8"
optional = true

[[bin]]
name = "browser_demo"
required-features = ["browser"]

[[bin]]
name = "recipe_shot"
required-features = ["browser"]

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json", "cookies", "form"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
