name: container

# Builds the multi-arch (amd64+arm64) core image and publishes it to GHCR:
#   ghcr.io/<owner>/blazonry:latest   (FROM scratch, native only)
# On v* tags the same image publishes as :<tag>.
#
# Dockerfile.browser is not published here. Build it by hand if you need the
# Chromium render backend. Neither is Dockerfile.exthost, the extension host and
# builder sidecar; it carries a Rust toolchain and only dev mode needs it.
#
# No secrets needed: GITHUB_TOKEN has write:packages for this repo's registry.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        run: |
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "TAGS=${IMAGE}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "TAGS=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "Build (PRs: local only)"
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: blazonry:pr
          cache-from: type=gha,scope=core
          cache-to: type=gha,scope=core,mode=max

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.TAGS }}
          cache-from: type=gha,scope=core
          cache-to: type=gha,scope=core,mode=max
