name: container

# Builds the multi-arch (amd64+arm64) images and publishes them to GHCR:
#   core    -> ghcr.io/<org>/blazonry:latest    (FROM scratch, native only)
#   browser -> ghcr.io/<org>/blazonry:browser   (Chromium render backend)
# On v* tags the same images publish as :<tag> and :<tag>-browser.
#
# No secrets needed: GITHUB_TOKEN has write:packages for this repo's registry.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: core
            file: Dockerfile
            suffix: ""
          - variant: browser
            file: Dockerfile.browser
            suffix: "-browser"
    name: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$IMAGE" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "TAGS=${IMAGE}:${GITHUB_REF_NAME}${SUFFIX}" >> "$GITHUB_OUTPUT"
          else
            {
              echo "TAGS<<EOF"
              echo "${IMAGE}:latest${SUFFIX}"
              [[ "${SUFFIX}" == "-browser" ]] && echo "${IMAGE}:browser"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "Build (PRs: local only)"
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          tags: blazonry:${{ matrix.variant }}-pr
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.TAGS }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
