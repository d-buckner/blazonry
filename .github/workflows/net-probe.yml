name: net-probe

# Temporary. Reports which toolchain hosts a GitHub runner can reach.
on:
  push:
    branches: [main]

jobs:
  amd64:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          for u in \
            "https://musl.cc/x86_64-linux-musl-cross.tgz" \
            "https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--musl--stable-2026.08-1.tar.xz" \
            "https://toolchains.bootlin.com/downloads/releases/toolchains/x86-64/tarballs/x86-64--musl--stable-2026.08-1.tar.xz" \
            "https://deb.debian.org/debian/Release" \
            "https://static.rust-lang.org/dist/channel-rust-stable.toml" \
            "https://ghcr.io/v2/" \
            "https://crates.io/api/v1/crates/libc"
          do
            code=$(curl -4 -sS -o /dev/null -w '%{http_code}' --connect-timeout 8 --max-time 25 -I "$u" 2>/dev/null || echo ERR)
            printf '%-6s %s\n' "$code" "$u"
          done

  arm64:
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - name: probe
        run: |
          echo "arch: $(uname -m)"
          echo "musl-gcc from apt: $(apt-cache policy musl-tools 2>/dev/null | head -2 | tr '\n' ' ')"
          for u in \
            "https://musl.cc/aarch64-linux-musl-cross.tgz" \
            "https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--musl--stable-2026.08-1.tar.xz"
          do
            code=$(curl -4 -sS -o /dev/null -w '%{http_code}' --connect-timeout 8 --max-time 25 -I "$u" 2>/dev/null || echo ERR)
            printf '%-6s %s\n' "$code" "$u"
          done
